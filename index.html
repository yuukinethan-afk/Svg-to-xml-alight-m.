<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convert By Ningen — SVG to XML</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      background: #0a100d;
      color: #e9f5e1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(127, 217, 87, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(217, 178, 90, 0.08), transparent 25%);
    }

    /* --- BANNER SECTION --- */
    /* --- BANNER SECTION --- */
    .banner-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9; /* INI KUNCI RAHASIANYA: Mengunci rasio 16:9 */
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a24; 
    }

    .banner-container::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, #7fd957, #e9f5b8, #d9b25a);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 4;
    }

    .banner-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }
    .banner-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(10,16,13,0.2), rgba(10,16,13,0.8));
      z-index: 2;
      pointer-events: none;
    }

    .banner-content {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    /* --- TITLE EFFECT --- */
    .neon-title {
      font-size: clamp(32px, 8vw, 72px);
      line-height: 1.05;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #7fd957, #e9f5b8, #d9b25a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(127, 217, 87, 0.6));
      animation: glow 3s infinite alternate;
    }

    .neon-title span {
      display: block;
      font-size: clamp(13px, 2.4vw, 20px);
      font-weight: 600;
      letter-spacing: 4px;
      color: #fff;
      -webkit-text-fill-color: #fff;
      text-shadow: 0 0 10px #7fd957;
      margin-top: 5px;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 10px rgba(127, 217, 87, 0.4)); }
      to { filter: drop-shadow(0 0 25px rgba(217, 178, 90, 0.6)); }
    }

    /* --- DROP ZONE (GLASSMORPHISM) --- */
    .drop-zone {
      width: 100%;
      max-width: 520px;
      border: 2px solid transparent;
      background:
        linear-gradient(rgba(14, 22, 18, 0.85), rgba(14, 22, 18, 0.85)) padding-box,
        linear-gradient(135deg, #7fd957, #e9f5b8, #d9b25a) border-box;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
            backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .drop-zone:hover, .drop-zone.dragover {
      box-shadow: 0 0 28px rgba(127, 217, 87, 0.35);
      transform: translateY(-2px);
    }

    .drop-zone p { color: #aaa; font-size: 15px; position: relative; z-index: 1; }
    .drop-zone .browse { color: #7fd957; font-weight: 600; text-decoration: underline; cursor: pointer; }
    .drop-zone .browse:hover { color: #e9f5b8; }

    /* --- FILE LIST --- */
    .file-list {
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
            border: 1px solid transparent;
      background:
        linear-gradient(rgba(20, 30, 24, 0.9), rgba(20, 30, 24, 0.9)) padding-box,
        linear-gradient(90deg, rgba(127, 217, 87, 0.6), rgba(217, 178, 90, 0.6)) border-box;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .file-item .name-input {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
      width: 100%;
    }

    .file-item .name-input:focus { border-color: #7fd957; background: #101a14; }
    .file-item .size { color: #888; font-size: 11px; flex-shrink: 0; font-weight: 600; }
    .file-item .status { font-size: 12px; flex-shrink: 0; font-weight: bold; }
    .file-item .status.ok { color: #4ade80; }
    .file-item .status.err { color: #f87171; }
    .file-item .remove { background: none; border: none; color: #555; cursor: pointer; font-size: 20px; padding: 0 5px; }
    .file-item .remove:hover { color: #f87171; }

    /* --- BUTTONS & PROGRESS --- */
    .progress-bar {
      width: 100%; max-width: 520px; height: 6px; background: #222; border-radius: 3px; margin-top: 20px; overflow: hidden; display: none;
    }
    .progress-bar .fill {
      height: 100%; background: linear-gradient(90deg, #7fd957, #d9b25a); border-radius: 3px; width: 0%; transition: width 0.2s ease; box-shadow: 0 0 10px #7fd957;
    }

    .actions { width: 100%; max-width: 520px; margin-top: 20px; display: flex; gap: 12px; }

    button.convert {
      flex: 1; padding: 14px 0; border: none; border-radius: 12px; background: linear-gradient(135deg, #7fd957, #d9b25a); color: #0a100d; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(127, 217, 87, 0.3);
    }
    button.convert:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    button.convert:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(127, 217, 87, 0.5); }
    
    button.clear {
      padding: 14px 24px; border: 2px solid transparent; border-radius: 12px; background: linear-gradient(#0e1612, #0e1612) padding-box, linear-gradient(135deg, #7fd957, #d9b25a) border-box; color: #e9f5b8; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    button.clear:hover { color: #fff; box-shadow: 0 0 20px rgba(127, 217, 87, 0.35); }

    .info { margin-top: 16px; font-size: 12px; color: #777; text-align: center; }

    /* --- BANNER TITLE: gaya poster (ide sendiri) --- */
    .banner-container {
      justify-content: flex-start;
      align-items: flex-end;
    }
    .banner-content {
      text-align: left;
      padding: 10px 12px;
    }
    .neon-title {
      font-size: 5px;
      line-height: 1.05;
      letter-spacing: 3px;
      background: none;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: #f4fbe8;
      color: #f4fbe8;
      filter: none;
      text-shadow: 0 0 18px rgba(127, 217, 87, 0.55), 0 2px 0 rgba(0, 0, 0, 0.4);
      animation: none;
    }
    .banner-content > span {
      display: block;
      margin-top: 12px;
      padding-top: 12px;
      font-size: 5px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #d9b25a;
      -webkit-text-fill-color: #d9b25a;
      text-shadow: none;
      border-top: 2px solid;
      border-image: linear-gradient(90deg, #7fd957, #d9b25a) 1;
      width: fit-content;
    }

    /* --- DAUN BERJATUHAN --- */
    .leaves {
      position: absolute; inset: 0;
      z-index: 2; pointer-events: none; overflow: hidden;
    }
    .leaf {
      position: absolute;
      top: -12%;
      width: var(--size);
      height: calc(var(--size) * 0.55);
      background: linear-gradient(135deg, #b8f27a, #4fae3c 60%, #2f7d32);
      border-radius: 0 100% 0 100%;
      opacity: 0.85;
      box-shadow: 0 0 8px rgba(127, 217, 87, 0.5);
      left: var(--x);
      animation: fall var(--dur) linear var(--delay) infinite;
    }
    @keyframes fall {
      0%   { top: -10%;  transform: translateX(0)     rotate(0deg); }
      25%  { top: 25%;   transform: translateX(30px)  rotate(90deg); }
      50%  { top: 50%;   transform: translateX(-25px) rotate(180deg); }
      75%  { top: 75%;   transform: translateX(25px)  rotate(270deg); }
      100% { top: 110%;  transform: translateX(-10px) rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaf { animation: none; display: none; }
    }
  </style>
</head>
<body>

  <!-- BANNER & JUDUL -->
  <div class="banner-container">
    <!-- Video banner: taruh file mp4 di folder yang sama dengan index.html -->
    <video class="banner-video" autoplay loop muted playsinline>
  <source src="banner.mp4" type="video/mp4">
</video>
    
    <div class="banner-overlay"></div>
    <div class="leaves" id="leaves"></div>
    <div class="banner-content">
      <h1 class="neon-title">Convert By Ningen</h1>
      <span>SVG ﻝﮞ=D  ALIGHT MOTION XML</span>
    </div>
  </div>

  <!-- AREA UPLOAD SVG -->
  <div class="drop-zone" id="dropZone">
    <p>Drag & drop SVG files here<br>or <span class="browse">browse files</span></p>
    <p style="margin-top:10px;font-size:12px;color:#555;">Up to 30 files • Max 5MB each</p>
    <input type="file" id="fileInput" accept=".svg" multiple hidden>
  </div>

  <div class="file-list" id="fileList"></div>
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

  <div class="actions">
    <button class="convert" id="convertBtn" disabled>Convert Now</button>
    <button class="clear" id="clearBtn">Clear</button>
  </div>

  <p class="info" id="info">Tips: Klik nama file di atas untuk mengganti nama sebelum di-convert.</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="SmlVerter.js"></script>
  <script>
    // Buat daun berjatuhan di banner
    (function makeLeaves() {
      const box = document.getElementById("leaves");
      if (!box) return;
      const COUNT = 16;
      for (let i = 0; i < COUNT; i++) {
        const leaf = document.createElement("div");
        leaf.className = "leaf";
        leaf.style.setProperty("--size", (10 + Math.random() * 14).toFixed(1) + "px");
        leaf.style.setProperty("--x", (Math.random() * 100).toFixed(1) + "%");
        leaf.style.setProperty("--dur", (6 + Math.random() * 6).toFixed(1) + "s");
        leaf.style.setProperty("--delay", (-Math.random() * 10).toFixed(1) + "s");
        box.appendChild(leaf);
      }
    })();

    const MAX_FILES = 30;
    let files = []; 

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const convertBtn = document.getElementById("convertBtn");
    const clearBtn = document.getElementById("clearBtn");
    const info = document.getElementById("info");

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
    clearBtn.addEventListener("click", clearAll);
    convertBtn.addEventListener("click", convert);

    function addFiles(newFiles) {
      for (const f of newFiles) {
        if (files.length >= MAX_FILES) { info.textContent = "Maximum 30 files."; break; }
        if (!f.name.toLowerCase().endsWith(".svg")) continue;
        if (files.some(x => x.name === f.name)) continue;
        files.push({ file: f, name: f.name });
      }
      renderList();
    }

    function removeFile(index) {
      files.splice(index, 1);
      renderList();
    }

    function clearAll() {
      files = [];
      renderList();
      progressBar.style.display = "none";
      progressFill.style.width = "0%";
      info.textContent = "Tips: Klik nama file di atas untuk mengganti nama sebelum di-convert.";
    }

    function renderList() {
      fileList.innerHTML = "";
      files.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "file-item";
        div.innerHTML = `
          <input type="text" class="name-input" value="${item.name}" data-i="${i}" title="Klik untuk ganti nama">
          <span class="size">${(item.file.size / 1024).toFixed(1)} KB</span>
          <span class="status" id="status-${i}"></span>
          <button class="remove" data-i="${i}">&times;</button>`;
        fileList.appendChild(div);
      });

      fileList.querySelectorAll(".remove").forEach(btn => {
        btn.addEventListener("click", (e) => removeFile(Number(e.target.dataset.i)));
      });

      fileList.querySelectorAll(".name-input").forEach(input => {
        input.addEventListener("change", (e) => {
          const index = Number(e.target.dataset.i);
          let newName = e.target.value.trim();
          if (!newName) {
            newName = files[index].file.name;
            e.target.value = newName;
          } else if (!newName.toLowerCase().endsWith(".svg")) {
            newName += ".svg";
            e.target.value = newName;
          }
          files[index].name = newName;
        });
      });

      convertBtn.disabled = files.length === 0;
    }

    async function convert() {
      if (files.length === 0) return;
      convertBtn.disabled = true;
      progressBar.style.display = "block";
      progressFill.style.width = "0%";
      info.textContent = "Converting... Please wait.";

      const results = [];
      for (let i = 0; i < files.length; i++) {
        const statusEl = document.getElementById(`status-${i}`);
        try {
          const item = files[i];
          const text = await item.file.text();
          const result = window.SmlVerter.convertSvgToXml(text, item.name);
          results.push(result);
          if (statusEl) { statusEl.textContent = "✓"; statusEl.className = "status ok"; }
        } catch (err) {
          if (statusEl) { statusEl.textContent = "✗ " + err.message.slice(0, 30); statusEl.className = "status err"; }
        }
        progressFill.style.width = `${((i + 1) / files.length * 100).toFixed(0)}%`;
      }

      if (results.length === 0) {
        info.textContent = "No files converted successfully. Check your SVG files.";
        convertBtn.disabled = false;
        return;
      }

      if (results.length === 1) {
        downloadFile(results[0].filename, results[0].xml, "application/xml");
        info.textContent = `Done — downloaded ${results[0].filename}`;
      } else {
        const zip = new JSZip();
        for (const r of results) zip.file(r.filename, r.xml);
        const blob = await zip.generateAsync({ type: "blob" });
        downloadBlob("Ningen_Export.zip", blob);
        info.textContent = `Done — downloaded ${results.length} files as ZIP`;
      }
      convertBtn.disabled = false;
    }

    function downloadFile(name, content, type) {
      const blob = new Blob([content], { type });
      downloadBlob(name, blob);
    }

    function downloadBlob(name, blob) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
